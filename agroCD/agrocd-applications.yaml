apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toggle-master-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/4DCL-Pos-em-DevOps-Cloud-Architecture/tech-challenge-infra.git'
    targetRevision: HEAD
    path: 'gitops/analytics-service'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: analytics-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 0.20.2
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
