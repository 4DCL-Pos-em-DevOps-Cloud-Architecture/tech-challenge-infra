apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toggle-master-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/4DCL-Pos-em-DevOps-Cloud-Architecture/tech-challenge-infra.git'
    targetRevision: HEAD
    path: 'gitops/analytics-service'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: toggle-master
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
---
