apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: targeting-secrets
  namespace: targeting-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: targeting-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/dev/targeting/database
        property: DATABASE_URL
