apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-secrets
  namespace: flag-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: flag-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/dev/flag/database
        property: DATABASE_URL
